[package]
name = "xmlsec"
version = "1.1.0"
authors = [
    "Leonhard Weber <leonhard.weber@voipir.cl>",
    "Stefan Sommerfeld <stefan.sommerfeld@gmail.com>",
]
edition = "2024"
readme = "README.md"
license = "MIT"
description = "Wrapper for xmlsec1 library"
homepage = "https://github.com/zerocom38/rust-xmlsec"
repository = "https://github.com/zerocom38/rust-xmlsec"
keywords = ["xml", "xmlsec", "dsig"]
build = "build.rs"

[features]
default = ["vendored"]
vendored = []
bindgen = ["dep:bindgen"]

[dependencies]
libxml = "0.3.21"
openssl-sys = "0.9.117"
openssl = "0.10.81"
bitflags = "2.13.1"
log = "0.4.34"
once_cell = "1.21.4"

[dev-dependencies]
env_logger = "0.11.11"

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
cc = "1.4.4"

[target.'cfg(windows)'.build-dependencies]
vcpkg = "0.2.15"

[target.'cfg(macos)'.build-dependencies]
pkg-config = "0.3.34"

[target.'cfg(unix)'.build-dependencies]
pkg-config = "0.3.34"
